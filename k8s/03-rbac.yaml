# --- store-api: ServiceAccount propria, le Nodes (recurso de cluster), nada mais
apiVersion: v1
kind: ServiceAccount
metadata:
  name: store-api
  namespace: store-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: store-api-node-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: store-api-node-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: store-api
    namespace: store-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: store-api-node-reader
---
# --- Grupo fiap:devs: le Pods e logs em store-prod. Sem delete, sem Secrets, sem exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devs-readonly
  namespace: store-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devs-readonly
  namespace: store-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: Group
    name: fiap:devs
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devs-readonly
