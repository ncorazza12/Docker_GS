apiVersion: v1
kind: ResourceQuota
metadata:
  name: store-prod-quota
  namespace: store-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  hard:
    pods: "40"
    requests.cpu: "3"
    requests.memory: 3Gi
    limits.cpu: "8"
    limits.memory: 6Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: store-prod-limits
  namespace: store-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 200m
        memory: 128Mi
      max:
        cpu: "1"
        memory: 512Mi
