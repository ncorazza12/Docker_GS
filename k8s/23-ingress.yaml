apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store-ingress
  namespace: store-prod
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  ingressClassName: traefik
  tls:
    # Secret criado direto no cluster (nao esta no Git): ver README
    - secretName: store-tls
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: store-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: store-front
                port:
                  number: 80
