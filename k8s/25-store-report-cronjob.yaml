apiVersion: batch/v1
kind: CronJob
metadata:
  name: store-report
  namespace: store-prod
  labels:
    app: store-report
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: store-report
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: store-report
              image: 367776931485.dkr.ecr.us-east-1.amazonaws.com/store-worker:1.0
              command: ["python", "-m", "worker.relatorio"]
              envFrom:
                - configMapRef:
                    name: store-api-config
              env:
                - name: DB_PASSWORD_FILE
                  value: /etc/db-secret/password
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: db-secret
                  mountPath: /etc/db-secret
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: db-secret
              secret:
                secretName: store-db-credentials
            - name: tmp
              emptyDir: {}
