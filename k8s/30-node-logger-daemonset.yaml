# DaemonSet proprio: um Pod por no, registrando carga e memoria do no no log.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-logger
  namespace: monitoring
  labels:
    app: node-logger
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    matchLabels:
      app: node-logger
  template:
    metadata:
      labels:
        app: node-logger
    spec:
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node-logger
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'while true; do echo "$(date -u +%FT%TZ) no=$NODE_NAME load=$(cut -d" " -f1-3 /proc/loadavg) $(grep MemAvailable /proc/meminfo)"; sleep 60; done'
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
